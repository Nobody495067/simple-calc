name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # Use the package's Vitest script, not Bun's incompatible native test runner.
      - name: Run calculator and library tests (Vitest)
        run: npm test

      - name: Build static calculator and library
        run: npm run build
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Check static export
        run: |
          test -s dist/client/index.html
          test -s dist/client/calc/library.html
          test -s dist/client/games-manifest.json
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - uses: actions/deploy-pages@v4
        id: deployment
