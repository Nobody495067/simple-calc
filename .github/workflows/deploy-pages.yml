name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # Use the package's Vitest script, not Bun's incompatible native test runner.
      - name: Run calculator and library tests (Vitest)
        run: npm test

      - name: Build static calculator and library
        run: npm run build
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      # The game HTML files live in the original calc repository. Keep the
      # customized simple-calc library and calculator here, and copy only the
      # game content directories into the Pages output.
      - name: Restore original game files from calc repository (6 processing parts)
        run: |
          # Download the source snapshot as a compressed archive (no .git history),
          # then extract once before processing the six copy batches.
          curl --fail --location --retry 3 --retry-delay 2 \
            https://codeload.github.com/Nobody495067/calc/tar.gz/refs/heads/main \
            --output /tmp/calc-source.tar.gz
          mkdir -p /tmp/calc-source dist/client/calc
          tar -xzf /tmp/calc-source.tar.gz --strip-components=1 -C /tmp/calc-source
          rm /tmp/calc-source.tar.gz

          # Copy with Python instead of rsync file lists. This safely handles
          # every filename and keeps each processing batch independent.
          python3 <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path("/tmp/calc-source")
          destination = Path("dist/client/calc")
          roots = ["gamelist", "Offline-HTML-Games-Pack-master", "emulator"]
          files = []
          for root in roots:
              for current, dirs, names in os.walk(source / root):
                  dirs.sort()
                  for name in sorted(names):
                      path = Path(current) / name
                      if path.is_file():
                          files.append(path)
          game_html = source / "game.html"
          if game_html.is_file():
              files.append(game_html)
          files.sort(key=lambda p: p.relative_to(source).as_posix())

          total = len(files)
          for part in range(6):
              first = part * total // 6
              last = (part + 1) * total // 6
              batch = files[first:last]
              print(f"========== Processing deployment part {part + 1}/6 ({len(batch)} files) ==========", flush=True)
              for path in batch:
                  relative = path.relative_to(source)
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, target)
              print(f"Part {part + 1}/6 complete.", flush=True)

          print(f"All six parts complete. Copied {total} files.", flush=True)
          PY

      - name: Check static export
        run: |
          # library.html resolves both manifests relative to /calc/ on GitHub Pages.
          cp -f games-manifest.json dist/client/calc/games-manifest.json
          # Keep the root copy for any older links or consumers that still use it.
          cp -f games-manifest.json dist/client/games-manifest.json
          test -s dist/client/index.html || (echo "Missing dist/client/index.html" && exit 1)
          test -s dist/client/calc/library.html || (echo "Missing dist/client/calc/library.html" && exit 1)
          test -s dist/client/calc/games-manifest.json || (echo "Missing dist/client/calc/games-manifest.json (required by library.html)" && exit 1)
          test -s dist/client/calc/game-art-manifest.json || (echo "Missing dist/client/calc/game-art-manifest.json" && exit 1)
          test -s dist/client/games-manifest.json || (echo "Missing dist/client/games-manifest.json" && exit 1)
          # Verify every local manifest entry exists in the deployed /calc/ tree.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.resolve('dist/client/calc');
          const entries = JSON.parse(fs.readFileSync('games-manifest.json', 'utf8'));
          const missing = entries.filter((entry) => {
            if (entry.startsWith('https://') || entry.startsWith('http://')) return false;
            return !fs.existsSync(path.resolve(root, entry));
          });
          if (missing.length) {
            console.error('Missing local game files:', missing.length);
            for (const entry of missing.slice(0, 40)) console.error(entry);
            process.exit(1);
          }
          console.log(`Verified ${entries.length} manifest entries; all local game paths exist.`);
          NODE
          echo "Largest exported directories:"
          du -h -d 2 dist/client | sort -h | tail -20
          echo "Total exported size:"
          du -sh dist/client
          touch dist/client/.nojekyll

      - name: Minify and protect the published site
        run: |
          # Only process the site's own pages and bundled application assets.
          # Legacy game files are left untouched to avoid breaking old games.
          for page in dist/client/calc/library.html dist/client/calc/settings.html; do
            if [ -f "$page" ]; then
              npx --yes html-minifier-terser@7.2.0 "$page" --output "$page" \
                --collapse-whitespace --remove-comments --minify-css true --minify-js true
            fi
          done

          # Obfuscate generated application bundles without changing the readable source repo.
          if [ -d dist/client/assets ]; then
            while IFS= read -r -d '' file; do
              temp_dir="$(mktemp -d)"
              npx --yes javascript-obfuscator@4.1.1 "$file" --output "$temp_dir" \
                --compact true --string-array true \
                --string-array-threshold 0.5
              generated="$temp_dir/$(basename "$file")"
              if [ ! -s "$generated" ]; then
                echo "Obfuscator did not create expected output for $file"
                exit 1
              fi
              mv -f "$generated" "$file"
              rm -rf "$temp_dir"
            done < <(find dist/client/assets -maxdepth 1 -type f -name '*.js' -print0)
          fi

          # Do not publish source maps, which can reveal original source.
          find dist/client -type f -name '*.map' -delete

          python3 <<'PY'
          from pathlib import Path
          for name in ("library.html", "settings.html"):
              page = Path("dist/client/calc") / name
              if page.exists():
                  content = page.read_text(encoding="utf-8")
                  notice = '<meta name="copyright" content="Copyright 2026 Nobody495067. All rights reserved.">'
                  if 'name="copyright"' not in content:
                      content = content.replace("<head>", "<head>" + notice, 1)
                      page.write_text(content, encoding="utf-8")
          Path("dist/client/COPYRIGHT.txt").write_text(
              "Copyright 2026 Nobody495067. All rights reserved.\\n"
              "The site's original design and code are protected by applicable copyright law.\\n",
              encoding="utf-8",
          )
          PY

      # Upload in the build job; deployment waits for this job to finish.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
