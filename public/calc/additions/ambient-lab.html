<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambient Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110d;color:#effff3;font-family:system-ui}canvas{display:block;width:100%;height:100%}.panel{position:fixed;top:14px;left:14px;padding:14px;background:#101b17dd;border:1px solid #ffffff22;border-radius:14px;z-index:2;backdrop-filter:blur(12px)}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#b4c6ba;margin:0 0 10px}button,select{background:#245b39;color:white;border:1px solid #55d87966;border-radius:8px;padding:8px;font-weight:650}.hint{position:fixed;bottom:10px;left:14px;color:#b4c6ba;font-size:12px}</style></head><body><canvas id="c"></canvas><div class="panel"><h1>Ambient Lab</h1><p>Make a moving background and watch it flow.</p><select id="mode"><option value="orbs">Floating orbs</option><option value="stars">Star field</option><option value="shapes">Geometric forms</option></select> <button id="pause">Pause</button> <button id="random">Randomize</button> <button id="full">Fullscreen</button></div><div class="hint">Move your pointer to influence the animation · Esc exits fullscreen</div><script type="module">const c=document.querySelector("#c");try{const T=await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");const r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));const s=new T.Scene();s.background=new T.Color(0x07110d);const cam=new T.PerspectiveCamera(55,1,.1,100);cam.position.z=10;s.add(new T.AmbientLight(0xffffff,1.5));let items=[],paused=false,seed=3,px=0,py=0;const colors=[0x55d879,0x48a8d8,0xa17be8,0xf2c66d];function clear(){items.forEach(o=>{s.remove(o.m);o.m.geometry.dispose();o.m.material.dispose()});items=[]}function build(){clear();seed++;let mode=document.querySelector("#mode").value;for(let i=0;i<(mode==="stars"?500:65);i++){seed=(seed*1664525+1013904223)>>>0;let rand=seed/4294967296;let geo=mode==="stars"?new T.SphereGeometry(.02+rand*.025,5,5):mode==="shapes"?new T.IcosahedronGeometry(.2+rand*.35,1):new T.SphereGeometry(.15+rand*.45,14,10);let mat=new T.MeshStandardMaterial({color:colors[Math.floor(rand*4)],wireframe:mode==="shapes",transparent:true,opacity:.8});let m=new T.Mesh(geo,mat);m.position.set((rand-.5)*17,(Math.sin(i*3.2)) *4,(rand-.5)*7);s.add(m);items.push({m,x:m.position.x,y:m.position.y,p:rand*6.28,v:.2+rand*.5})}}function resize(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener("resize",resize);addEventListener("pointermove",e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2});resize();build();document.querySelector("#mode").onchange=build;document.querySelector("#random").onclick=build;document.querySelector("#pause").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause"};document.querySelector("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();function frame(t){requestAnimationFrame(frame);if(!paused)items.forEach(o=>{let p=t*.0003*o.v+o.p;o.m.position.x=o.x+Math.sin(p)*(.4+Math.abs(px));o.m.position.y=o.y+Math.cos(p*1.2)*(.4+Math.abs(py));o.m.rotation.x=p*.3;o.m.rotation.y=p*.2});r.render(s,cam)}frame(0)}catch(e){const x=c.getContext("2d");function f(t){c.width=innerWidth;c.height=innerHeight;x.fillStyle="#07110d";x.fillRect(0,0,c.width,c.height);for(let i=0;i<24;i++){let a=(Math.sin(t*.0002+i)*.5+.5)*c.width,b=(Math.cos(t*.00017+i*2)*.5+.5)*c.height,g=x.createRadialGradient(a,b,1,a,b,100);g.addColorStop(0,"#55d87966");g.addColorStop(1,"#55d87900");x.fillStyle=g;x.fillRect(a-100,b-100,200,200)}requestAnimationFrame(f)}f(0)}</script></body></html>
