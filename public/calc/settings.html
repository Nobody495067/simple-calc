<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Settings</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; color: #f4f7f5; background: radial-gradient(ellipse at 50% -18%, rgba(48,112,70,.22), transparent 52%), #0d1210; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(720px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0; color: #55d879; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.04em; }
    a, button { color: inherit; }
    .back { text-decoration: none; padding: 10px 14px; border: 1px solid rgba(148,163,184,.2); border-radius: 10px; background: #191f1d; }
    section { margin: 16px 0; padding: 20px; border: 1px solid rgba(148,163,184,.16); border-radius: 16px; background: #191f1d; box-shadow: 0 10px 28px rgba(0,0,0,.2); }
    h2 { margin: 0 0 8px; font-size: 19px; }
    p { margin: 0 0 15px; color: #9aa8a0; line-height: 1.5; }
    .choices { display: flex; flex-wrap: wrap; gap: 10px; }
    button { padding: 10px 15px; border: 1px solid rgba(85,216,121,.25); border-radius: 10px; background: #234b32; color: #e9fff0; font-weight: 700; cursor: pointer; }
    button:hover, button[aria-pressed="true"] { background: #2c7544; border-color: #55d879; }
    .key-row { display: grid; grid-template-columns: 1fr minmax(130px, 190px); align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(148,163,184,.12); }
    .key-row:first-of-type { border-top: 0; }
    label { font-weight: 650; }
    input { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid rgba(148,163,184,.25); border-radius: 9px; background: #101713; color: #fff; font: inherit; text-align: center; }
    #status { min-height: 22px; color: #55d879; font-size: 14px; margin-top: 12px; }
    @media (max-width: 520px) { .key-row { grid-template-columns: 1fr; gap: 8px; } section { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Settings</h1><a class="back" href="library.html">← Library</a></header>
    <section>
      <h2>Background</h2>
      <p>Choose the appearance used by the game library.</p>
      <div class="choices" id="backgrounds">
        <button type="button" data-background="default">Default</button>
        <button type="button" data-background="midnight">Midnight</button>
        <button type="button" data-background="purple">Purple</button>
        <button type="button" data-background="light">Light</button>
      </div>
    </section>
    <section>
      <h2>Keybinds</h2>
      <p>Click a field and press the key you want to assign. Shortcuts are active while the library is open, except when typing in a text field.</p>
      <div class="key-row"><label for="back-key">Back to library (while a game is open)</label><input id="back-key" type="text" maxlength="1" placeholder="Not set" autocomplete="off"></div>
      <div class="key-row"><label for="fullscreen-key">Toggle game fullscreen</label><input id="fullscreen-key" type="text" maxlength="1" placeholder="Not set" autocomplete="off"></div>
      <div class="choices"><button id="save" type="button">Save keybinds</button><button id="reset" type="button">Reset settings</button></div>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const defaults = { background: "default", backKey: "", fullscreenKey: "" };
    let settings = { ...defaults };
    try { settings = { ...defaults, ...JSON.parse(localStorage.getItem("librarySettings") || "{}") }; } catch {}
    const status = document.getElementById("status");
    function save() {
      localStorage.setItem("librarySettings", JSON.stringify(settings));
      status.textContent = "Settings saved.";
      updateBackgroundButtons();
    }
    function updateBackgroundButtons() {
      document.querySelectorAll("[data-background]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.background === settings.background));
      });
    }
    document.querySelectorAll("[data-background]").forEach(button => {
      button.addEventListener("click", () => {
        settings.background = button.dataset.background;
        save();
      });
    });
    const backInput = document.getElementById("back-key");
    const fullscreenInput = document.getElementById("fullscreen-key");
    backInput.value = settings.backKey;
    fullscreenInput.value = settings.fullscreenKey;
    function captureKey(input) {
      input.addEventListener("keydown", event => {
        event.preventDefault();
        if (event.key === "Backspace" || event.key === "Delete") input.value = "";
        else if (event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey) input.value = event.key.toLowerCase();
        status.textContent = "Press Save keybinds to apply your changes.";
      });
    }
    captureKey(backInput);
    captureKey(fullscreenInput);
    document.getElementById("save").addEventListener("click", () => {
      settings.backKey = backInput.value.trim().toLowerCase();
      settings.fullscreenKey = fullscreenInput.value.trim().toLowerCase();
      if (settings.backKey && settings.backKey === settings.fullscreenKey) {
        status.textContent = "Choose two different keys for these shortcuts.";
        return;
      }
      save();
    });
    document.getElementById("reset").addEventListener("click", () => {
      settings = { ...defaults };
      backInput.value = "";
      fullscreenInput.value = "";
      save();
      status.textContent = "Settings reset.";
    });
    updateBackgroundButtons();
  </script>
</body>
</html>
