<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>GBA Game Library</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; background: #10141d; color: #eef2ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(900px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 40px); }
    .sub { margin: 0 0 24px; color: #9ca9bd; }
    #status { color: #aebbd0; margin: 18px 0; }
    #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .game { display: block; padding: 16px; border: 1px solid #293447; border-radius: 12px; background: #192231; color: #eaf1ff; text-decoration: none; transition: border-color .15s, transform .15s, background .15s; }
    .game:hover, .game:focus-visible { border-color: #60a5fa; background: #202d40; transform: translateY(-2px); outline: none; }
    .game strong { display: block; overflow-wrap: anywhere; }
    .play { display: block; margin-top: 7px; color: #79b8ff; font-size: 13px; }
    .back { display: inline-block; margin-bottom: 18px; color: #9cc9ff; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../library.html">← Back to main library</a>
    <h1>Game Boy Advance</h1>
    <p class="sub">Choose a game to open it in EmulatorJS.</p>
    <p id="status" role="status">Loading games…</p>
    <section id="games" aria-label="Available games"></section>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const gamesEl = document.getElementById('games');

    fetch('./games.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Could not load games.json (' + response.status + ')');
        return response.json();
      })
      .then(games => {
        if (!Array.isArray(games)) throw new Error('games.json must contain a list.');
        statusEl.textContent = games.length
          ? games.length + ' game(s) available.'
          : 'No games yet. Add authorized ZIP files to the zips folder and run build.py.';
        for (const game of games) {
          if (!game || typeof game.title !== 'string' || typeof game.path !== 'string') continue;
          const link = document.createElement('a');
          link.className = 'game';
          link.href = './play.html?rom=' + encodeURIComponent(game.path) + '&title=' + encodeURIComponent(game.title);
          const title = document.createElement('strong');
          title.textContent = game.title;
          const hint = document.createElement('span');
          hint.className = 'play';
          hint.textContent = 'Open game →';
          link.append(title, hint);
          gamesEl.appendChild(link);
        }
      })
      .catch(error => {
        statusEl.textContent = error.message;
      });
  </script>
</body>
</html>
