<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f16">
  <title>Play GBA</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0b0f16; color: #fff; font-family: system-ui, sans-serif; }
    #game { width: 100%; height: 100%; }
    #message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #cbd5e1; }
    #message a { color: #93c5fd; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="message">Preparing EmulatorJS…</div>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const romParam = params.get('rom');
      const title = params.get('title') || 'Game Boy Advance';
      const message = document.getElementById('message');

      function fail(text) {
        message.textContent = text;
        message.style.zIndex = '10';
      }

      if (!romParam) {
        fail('No game was selected. Return to the GBA library and choose a game.');
        return;
      }

      let romUrl;
      try {
        romUrl = new URL(romParam, location.href);
      } catch {
        fail('The game URL is invalid.');
        return;
      }

      const allowedBase = new URL('./roms/', location.href);
      if (romUrl.origin !== location.origin ||
          !romUrl.pathname.startsWith(allowedBase.pathname) ||
          !romUrl.pathname.toLowerCase().endsWith('.gba')) {
        fail('This page only loads GBA files from its own roms folder.');
        return;
      }

      document.title = title + ' — EmulatorJS';
      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_gameUrl = romUrl.href;
      window.EJS_gameName = title;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      loader.onload = () => { message.style.display = 'none'; };
      loader.onerror = () => fail('EmulatorJS could not load. Check your internet connection and refresh.');
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
